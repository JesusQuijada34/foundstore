<!doctype html>
<html lang="es" data-country="{{ visitor_country }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foundstore · Danenone</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#16231d;background:#f5f7f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(125deg,#f7fbf9,#e9f1ed 48%,#f5f7f6)}button,select,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:268px 1fr}.sidebar{padding:26px 18px;background:rgba(245,248,246,.84);border-right:1px solid #d9e2dd;backdrop-filter:blur(18px);position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.04em;margin:0 8px 28px}.cube{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:#0d8c57;color:white;font-size:12px;box-shadow:0 9px 20px #0d8c5733}.search{display:flex;align-items:center;gap:8px;background:#e6eeea;border:1px solid #d1ddd6;padding:10px 12px;border-radius:12px;margin-bottom:22px}.search input{border:0;outline:0;background:transparent;width:100%;color:#16231d}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#77867d;font-weight:800;margin:21px 10px 8px}.nav button{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;color:#415148;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:650}.nav button:hover,.nav button.active{background:#dfece5;color:#076a40}.nav-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.75}.sidebar-bottom{position:absolute;bottom:20px;left:18px;right:18px;border-top:1px solid #d9e2dd;padding-top:16px}.language{width:100%;border:1px solid #cedbd3;border-radius:10px;padding:9px;background:white;color:#25352c}.content{padding:35px clamp(24px,5vw,72px) 64px;min-width:0}.topline{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#168454}.account{padding:9px 14px;background:white;border:1px solid #d8e5dd;border-radius:99px;color:#355246;font-weight:650;font-size:14px}.account a{color:#087b49;text-decoration:none;font-weight:800}.title{font-size:clamp(32px,5vw,62px);letter-spacing:-.065em;margin:12px 0 12px;line-height:.98}.sub{color:#65776d;max-width:700px;line-height:1.6;margin:0}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:32px 0 16px;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #d2ded7;background:white;color:#4b5e53;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}.chip.active{background:#0a8d56;color:white;border-color:#0a8d56}.notice{font-size:13px;color:#087b49;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:18px;background:rgba(255,255,255,.89);border:1px solid #dce7e0;border-radius:18px;box-shadow:0 12px 28px #1638270b;transition:transform .2s ease,box-shadow .2s ease;border-left:4px solid transparent}.card:hover{transform:translateY(-3px);box-shadow:0 20px 40px #16382717;border-left-color:#15a467}.icon{width:72px;height:72px;border-radius:18px;background:linear-gradient(145deg,#c4f5d6,#4cc985);display:grid;place-items:center;color:#075a37;font-weight:900;font-size:23px;box-shadow:inset 0 1px #ffffffaa}.card h2{margin:2px 0 4px;letter-spacing:-.035em;font-size:20px}.card p{color:#6a796f;line-height:1.45;font-size:14px;margin:0 0 12px;min-height:40px}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center}.category{font-size:12px;color:#6f8176;font-weight:750}.open{border:0;border-radius:10px;padding:8px 10px;background:#e1f4e8;color:#087b49;text-decoration:none;font-weight:800;font-size:13px}.empty{padding:35px;background:white;border:1px dashed #bed0c5;border-radius:18px;color:#607268;grid-column:1/-1}.status-panel{margin-top:24px;padding:16px 18px;background:#eff8f2;border:1px solid #cce5d4;border-radius:16px;display:none;color:#315a40}.status-panel.show{display:block}.status-panel strong{display:block;margin-bottom:4px}@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:relative;display:flex;align-items:center;gap:12px;padding:13px 16px}.brand{margin:0}.search{margin:0;flex:1}.nav,.nav-label,.sidebar-bottom{display:none}.content{padding:26px 18px}.grid{grid-template-columns:1fr}}@media(max-width:460px){.topline{align-items:flex-start;flex-direction:column}.card{grid-template-columns:62px 1fr}.icon{width:60px;height:60px}.account{border-radius:14px}}
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><span class="cube">FD</span><span>Foundstore</span></div>
        <label class="search" aria-label="Buscar"><span>⌕</span><input id="search" type="search" autocomplete="off"></label>
        <div class="nav-label" data-i18n="browse">Explorar</div>
        <nav class="nav" id="categoryNav"></nav>
        <div class="sidebar-bottom"><select class="language" id="language" aria-label="Idioma"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="ru">Русский</option></select></div>
      </aside>
      <main class="content">
        <div class="topline"><span class="eyebrow" data-i18n="eyebrow">Influent Danenone</span><div class="account" id="account"><span data-i18n="checking">Comprobando sesión…</span></div></div>
        <h1 class="title" data-i18n="title">Aplicaciones para tu DaneDesk</h1>
        <p class="sub" data-i18n="subtitle">Explora software Fluthin. Abre una ficha para conocer la aplicación y solicita su instalación en un DaneDesk que ya esté vinculado a tu cuenta.</p>
        <section class="status-panel" id="status" aria-live="polite"></section>
        <div class="toolbar"><div class="filters" id="filters"></div><span class="notice" id="notice"></span></div>
        <section class="grid" id="catalog"><div class="empty" data-i18n="loading">Cargando catálogo…</div></section>
      </main>
    </div>
    <script>
      const owner={{ catalog_owner|tojson }}, country=document.documentElement.dataset.country||'', catalogNode=document.getElementById('catalog'), search=document.getElementById('search'), account=document.getElementById('account'), notice=document.getElementById('notice'), language=document.getElementById('language'), status=document.getElementById('status');
      const words={es:{browse:'Explorar',checking:'Comprobando sesión…',title:'Aplicaciones para tu DaneDesk',subtitle:'Explora software Fluthin. Abre una ficha para conocer la aplicación y solicita su instalación en un DaneDesk que ya esté vinculado a tu cuenta.',loading:'Cargando catálogo…',all:'Todo',featured:'Destacado',categories:'Categorías',signin:'Iniciar sesión con GitHub',signed:'Sesión iniciada',noDevices:'Tu cuenta está lista, pero aún no tiene DaneDesk vinculados.',linkHint:'La licencia pertenece al dispositivo, no a tu cuenta web. Inicia el vínculo desde Foundstore Agent en el DaneDesk para que aparezca aquí.',devices:'DaneDesk disponibles',open:'Ver ficha',empty:'No hay aplicaciones que coincidan.',failed:'No se pudo cargar el catálogo.'},en:{browse:'Browse',checking:'Checking session…',title:'Apps for your DaneDesk',subtitle:'Explore Fluthin software. Open an app page to learn more and request an installation on a DaneDesk already linked to your account.',loading:'Loading catalog…',all:'All',featured:'Featured',categories:'Categories',signin:'Sign in with GitHub',signed:'Signed in',noDevices:'Your account is ready, but no DaneDesk is linked yet.',linkHint:'The license belongs to the device, not the web account. Start linking from Foundstore Agent on the DaneDesk so it appears here.',devices:'Available DaneDesk',open:'View app',empty:'No matching apps found.',failed:'The catalog could not be loaded.'},pt:{browse:'Explorar',checking:'Verificando sessão…',title:'Aplicativos para seu DaneDesk',subtitle:'Explore software Fluthin. Abra uma página do aplicativo e solicite a instalação em um DaneDesk vinculado à sua conta.',loading:'Carregando catálogo…',all:'Todos',featured:'Destaques',categories:'Categorias',signin:'Entrar com GitHub',signed:'Sessão iniciada',noDevices:'Sua conta está pronta, mas ainda não há DaneDesk vinculado.',linkHint:'A licença pertence ao dispositivo, não à conta web. Inicie o vínculo no Foundstore Agent do DaneDesk para vê-lo aqui.',devices:'DaneDesk disponíveis',open:'Ver aplicativo',empty:'Nenhum aplicativo encontrado.',failed:'Não foi possível carregar o catálogo.'},ru:{browse:'Обзор',checking:'Проверка сеанса…',title:'Приложения для DaneDesk',subtitle:'Откройте каталог Fluthin, ознакомьтесь с приложением и запросите установку на DaneDesk, связанный с вашей учетной записью.',loading:'Загрузка каталога…',all:'Все',featured:'Рекомендуемое',categories:'Категории',signin:'Войти через GitHub',signed:'Вход выполнен',noDevices:'Учетная запись готова, но DaneDesk еще не связан.',linkHint:'Лицензия относится к устройству, а не к веб-учетной записи. Запустите привязку из Foundstore Agent на DaneDesk.',devices:'Доступные DaneDesk',open:'Открыть',empty:'Приложения не найдены.',failed:'Не удалось загрузить каталог.'}};
      let locale=localStorage.getItem('foundstore-language')||((country==='RU')?'ru':(country==='BR'||country==='PT')?'pt':(navigator.language||'es').slice(0,2));if(!words[locale])locale='es';let active='all',packages=[],devices=[];language.value=locale;const t=k=>words[locale][k]||words.es[k];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      function translate(){document.documentElement.lang=locale;document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=t(n.dataset.i18n));search.placeholder=t('browse')+'…'}
      function updateAccount(){if(!window.signedIn){account.innerHTML=`<a href="/auth/github/login">${t('signin')}</a>`;return}if(!devices.length){account.innerHTML=`<strong>${t('signed')}</strong>`;status.innerHTML=`<strong>${t('noDevices')}</strong><span>${t('linkHint')}</span>`;status.classList.add('show');return}account.innerHTML=`<strong>${t('signed')}</strong> · ${devices.length} ${t('devices')}`;status.classList.remove('show')}
      function categories(){const values=['all',...new Set(packages.map(p=>p.category||'Fluthin'))];document.getElementById('categoryNav').innerHTML=values.map(value=>`<button class="${value===active?'active':''}" data-category="${esc(value)}"><span class="nav-dot"></span>${value==='all'?t('all'):esc(value)}</button>`).join('');document.getElementById('filters').innerHTML=values.slice(0,5).map(value=>`<button class="chip ${value===active?'active':''}" data-category="${esc(value)}">${value==='all'?t('all'):esc(value)}</button>`).join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{active=b.dataset.category;categories();render()})}
      function render(){const term=search.value.trim().toLowerCase();const visible=packages.filter(p=>(active==='all'||(p.category||'Fluthin')===active)&&`${p.name} ${p.description||''} ${(p.tags||[]).join(' ')}`.toLowerCase().includes(term));notice.textContent=`${visible.length} ${t('categories').toLowerCase()}`;catalogNode.innerHTML=visible.length?visible.map(p=>`<article class="card"><div class="icon" aria-hidden="true">${esc(p.name).slice(0,1).toUpperCase()}</div><div><div class="category">${esc(p.category||'Fluthin')}</div><h2>${esc(p.name)}</h2><p>${esc(p.description||'Fluthin application for Danenone.')}</p><div class="meta"><span class="category">${esc(p.author||owner)}</span><a class="open" href="/${encodeURIComponent(p.author||owner)}/${encodeURIComponent(p.slug)}">${t('open')}</a></div></div></article>`).join(''):`<div class="empty">${t('empty')}</div>`}
      async function start(){translate();try{const [me,catalog]=await Promise.all([fetch('/api/v1/me/devices'),fetch('/api/v1/catalog')]);window.signedIn=me.ok;devices=me.ok?(await me.json()).devices||[]:[];packages=catalog.ok?(await catalog.json()).packages||[]:[];updateAccount();categories();render()}catch(_){catalogNode.innerHTML=`<div class="empty">${t('failed')}</div>`}}language.onchange=()=>{locale=language.value;localStorage.setItem('foundstore-language',locale);translate();updateAccount();categories();render()};search.oninput=render;start();
    </script>
  </body>
</html>
