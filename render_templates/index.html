<!doctype html>
<html lang="es" data-country="{{ visitor_country }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foundstore · Danenone</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#16231d;background:#f5f7f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 95% 0,#c6f4da 0,transparent 30rem),linear-gradient(125deg,#f7fbf9,#e9f1ed 48%,#f5f7f6)}button,select,input{font:inherit}.shell{min-width:0;min-height:100vh;display:grid;grid-template-columns:268px minmax(0,1fr)}.sidebar{padding:26px 18px;background:rgba(245,248,246,.66);border-right:1px solid rgba(255,255,255,.72);box-shadow:inset -1px 0 rgba(121,157,136,.15);backdrop-filter:blur(16px) saturate(130%);position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.04em;margin:0 8px 28px}.cube{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:#0d8c57;color:white;font-size:12px;box-shadow:0 9px 20px #0d8c5733}.search{display:flex;align-items:center;gap:8px;background:rgba(230,238,234,.62);border:1px solid rgba(255,255,255,.78);padding:10px 12px;border-radius:12px;margin-bottom:22px}.search input{border:0;outline:0;background:transparent;width:100%;min-width:0;color:#16231d}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#77867d;font-weight:800;margin:21px 10px 8px}.nav button{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;color:#415148;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:650}.nav button:hover,.nav button.active{background:#dfece5;color:#076a40}.nav-dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.75}.sidebar-bottom{position:absolute;bottom:20px;left:18px;right:18px;border-top:1px solid #d9e2dd;padding-top:16px}.language{width:100%;border:1px solid rgba(255,255,255,.8);border-radius:10px;padding:9px;background:rgba(255,255,255,.64);color:#25352c}.content{padding:35px clamp(24px,5vw,72px) 64px;min-width:0}.topline{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#168454}.account{padding:9px 14px;background:rgba(255,255,255,.56);border:1px solid rgba(255,255,255,.8);border-radius:99px;backdrop-filter:blur(16px) saturate(130%);color:#355246;font-weight:650;font-size:14px}.account a{color:#087b49;text-decoration:none;font-weight:800}.title{font-size:clamp(32px,5vw,62px);letter-spacing:-.065em;margin:12px 0 12px;line-height:.98}.sub{color:#65776d;max-width:700px;line-height:1.6;margin:0}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:32px 0 16px;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap;min-width:0}.chip{border:1px solid rgba(255,255,255,.84);background:rgba(255,255,255,.6);backdrop-filter:blur(12px) saturate(130%);color:#4b5e53;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}.chip.active{background:#0a8d56;color:white;border-color:#0a8d56}.notice{font-size:13px;color:#087b49;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{min-width:0;display:grid;grid-template-columns:minmax(112px,152px) minmax(0,1fr);gap:16px;padding:18px;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.82);backdrop-filter:blur(16px) saturate(130%);border-radius:18px;box-shadow:0 12px 28px #16382712,inset 0 1px rgba(255,255,255,.56);transition:transform .2s ease,box-shadow .2s ease;border-left:4px solid transparent}.card:hover{transform:translateY(-3px);box-shadow:0 20px 40px #16382717;border-left-color:#15a467}.art{width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:13px;background:linear-gradient(135deg,#caefd8,#52cb89);align-self:start;display:grid;place-items:center}.art img{width:100%;height:100%;object-fit:cover;display:block}.art-fallback{font-weight:900;font-size:27px;color:#076940}.card h2{overflow-wrap:anywhere;margin:2px 0 4px;letter-spacing:-.035em;font-size:20px}.card p{color:#6a796f;line-height:1.45;font-size:14px;margin:0 0 12px;min-height:40px}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.category{font-size:12px;color:#6f8176;font-weight:750}.targets{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px}.target{font-size:11px;font-weight:800;border-radius:99px;padding:4px 7px;color:#176542;background:rgba(220,247,230,.68);border:1px solid rgba(27,129,77,.17)}.open{border:0;border-radius:10px;padding:8px 10px;background:#e1f4e8;color:#087b49;text-decoration:none;font-weight:800;font-size:13px}.empty{padding:35px;background:rgba(255,255,255,.68);border:1px dashed #bed0c5;border-radius:18px;color:#607268;grid-column:1/-1}.status-panel{margin-top:24px;padding:16px 18px;background:rgba(239,248,242,.7);border:1px solid rgba(204,229,212,.86);border-radius:16px;backdrop-filter:blur(16px);display:none;color:#315a40}.status-panel.show{display:block}.status-panel strong{display:block;margin-bottom:4px}@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{height:auto;position:relative;display:flex;align-items:center;gap:12px;padding:13px 16px}.brand{margin:0}.search{margin:0;flex:1}.nav,.nav-label,.sidebar-bottom{display:none}.content{padding:26px 18px}.grid{grid-template-columns:1fr}.card{grid-template-columns:180px minmax(0,1fr)}.art{width:180px}}@media(max-width:560px){.content{padding:24px 16px}.topline{align-items:flex-start;flex-direction:column}.toolbar{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.card{grid-template-columns:1fr}.art{width:100%;max-width:none}.card p{min-height:0}.account{border-radius:14px}}
    </style>
    <style>
      :root{color:#eef4ff;background:#0c101b}body{background:radial-gradient(circle at 84% 10%,rgba(44,74,111,.48),transparent 30rem),radial-gradient(circle at 8% 90%,rgba(9,103,68,.26),transparent 34rem),linear-gradient(145deg,#0a0e17,#131a2a 54%,#0c1019)}.sidebar{background:rgba(16,22,36,.78);border-right-color:rgba(142,162,199,.16);box-shadow:inset -1px 0 rgba(255,255,255,.04),16px 0 42px rgba(0,0,0,.12)}.brand{color:#f3f6ff}.cube{background:linear-gradient(135deg,#19bd79,#08744b);box-shadow:0 10px 25px rgba(11,174,105,.26)}.search{background:rgba(8,12,22,.56);border-color:rgba(155,176,214,.35);box-shadow:inset 0 1px rgba(255,255,255,.04)}.search span{display:grid;place-items:center;color:#b7c5de}.search svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2}.search input{color:#f0f5ff}.search input::placeholder{color:#8190ab}.nav-label,.category{color:#9caac2}.nav button{color:#c9d4e9}.nav button:hover,.nav button.active{color:#fff;background:linear-gradient(90deg,rgba(86,112,169,.42),rgba(75,92,138,.12));box-shadow:inset 0 1px rgba(255,255,255,.08)}.sidebar-bottom{border-top-color:rgba(142,162,199,.16)}.language{color:#dce8ff;background:rgba(12,18,31,.75);border-color:rgba(155,176,214,.32)}.eyebrow{color:#4ce8a1}.account{color:#c8d5eb;background:rgba(17,24,40,.7);border-color:rgba(155,176,214,.33);box-shadow:inset 0 1px rgba(255,255,255,.07)}.account a{color:#86f2bb}.title{color:#f4f7ff}.sub{color:#a9b6ca}.chip{color:#dce6f8;background:rgba(20,28,46,.72);border-color:rgba(153,174,215,.37);box-shadow:inset 0 1px rgba(255,255,255,.06),0 5px 14px rgba(0,0,0,.1)}.chip:hover{border-color:rgba(176,197,237,.66);background:rgba(34,45,70,.8)}.chip.active{background:linear-gradient(135deg,#23bb76,#0d8755);border-color:#52e8a0;box-shadow:0 8px 20px rgba(8,139,84,.3),inset 0 1px rgba(255,255,255,.22)}.notice{color:#73efb0}.card{background:linear-gradient(145deg,rgba(29,37,59,.84),rgba(16,22,38,.82));border-color:rgba(141,162,205,.23);box-shadow:inset 0 1px rgba(255,255,255,.07),0 17px 35px rgba(0,0,0,.2)}.card:hover{border-left-color:#44e9a1;box-shadow:inset 0 1px rgba(255,255,255,.09),0 22px 42px rgba(0,0,0,.3)}.card h2{color:#f1f5ff}.card p{color:#adbbcf}.target{color:#8dffc2;background:rgba(11,126,75,.18);border-color:rgba(76,232,161,.23)}.open{color:#93ffc6;background:rgba(10,130,76,.1);border:1px solid rgba(83,232,163,.48);box-shadow:inset 0 1px rgba(255,255,255,.08)}.open:hover{color:#092419;background:linear-gradient(135deg,#5be3a1,#24a86b);border-color:#73f0b1}.empty{color:#aebbd0;background:rgba(19,27,44,.68);border-color:rgba(142,162,199,.37)}.status-panel{color:#bcebd1;background:rgba(12,82,53,.26);border-color:rgba(93,224,154,.23)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #78f5b8;outline-offset:3px}@media(prefers-reduced-transparency:reduce){.sidebar,.account,.card,.chip,.search{backdrop-filter:none;background:#151c2d}}
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand"><span class="cube">FD</span><span>Foundstore</span></div>
        <label class="search" aria-label="Buscar"><span aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></span><input id="search" type="search" autocomplete="off"></label>
        <div class="nav-label" data-i18n="browse">Explorar</div>
        <nav class="nav" id="categoryNav"></nav>
        <div class="sidebar-bottom"><select class="language" id="language" aria-label="Idioma"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="ru">Русский</option></select></div>
      </aside>
      <main class="content">
        <div class="topline"><span class="eyebrow" data-i18n="eyebrow">Influent Danenone</span><div class="account" id="account"><span data-i18n="checking">Comprobando sesión…</span></div></div>
        <h1 class="title" data-i18n="title">Aplicaciones para tu DaneDesk</h1>
        <p class="sub" data-i18n="subtitle">Explora software Fluthin. Abre una ficha para conocer la aplicación y solicita su instalación en un DaneDesk que ya esté vinculado a tu cuenta.</p>
        <section class="status-panel" id="status" aria-live="polite"></section>
        <div class="toolbar"><div class="filters" id="filters"></div><div class="filters" id="platformFilters"></div><span class="notice" id="notice"></span></div>
        <section class="grid" id="catalog"><div class="empty" data-i18n="loading">Cargando catálogo…</div></section>
      </main>
    </div>
    <script>
      const owner={{ catalog_owner|tojson }}, country=document.documentElement.dataset.country||'', catalogNode=document.getElementById('catalog'), search=document.getElementById('search'), account=document.getElementById('account'), notice=document.getElementById('notice'), language=document.getElementById('language'), status=document.getElementById('status');
      const words={es:{browse:'Explorar',checking:'Comprobando sesión…',title:'Aplicaciones para tu DaneDesk',subtitle:'Explora software Fluthin. Abre una ficha para conocer la aplicación y solicita su instalación en un DaneDesk que ya esté vinculado a tu cuenta.',loading:'Cargando catálogo…',all:'Todo',featured:'Destacado',categories:'Categorías',signin:'Iniciar sesión con GitHub',signed:'Sesión iniciada',noDevices:'Tu cuenta está lista, pero aún no tiene DaneDesk vinculados.',linkHint:'La licencia pertenece al dispositivo, no a tu cuenta web. Inicia el vínculo desde Foundstore Agent en el DaneDesk para que aparezca aquí.',devices:'DaneDesk disponibles',open:'Ver ficha',empty:'No hay aplicaciones que coincidan.',failed:'No se pudo cargar el catálogo.'},en:{browse:'Browse',checking:'Checking session…',title:'Apps for your DaneDesk',subtitle:'Explore Fluthin software. Open an app page to learn more and request an installation on a DaneDesk already linked to your account.',loading:'Loading catalog…',all:'All',featured:'Featured',categories:'Categories',signin:'Sign in with GitHub',signed:'Signed in',noDevices:'Your account is ready, but no DaneDesk is linked yet.',linkHint:'The license belongs to the device, not the web account. Start linking from Foundstore Agent on the DaneDesk so it appears here.',devices:'Available DaneDesk',open:'View app',empty:'No matching apps found.',failed:'The catalog could not be loaded.'},pt:{browse:'Explorar',checking:'Verificando sessão…',title:'Aplicativos para seu DaneDesk',subtitle:'Explore software Fluthin. Abra uma página do aplicativo e solicite a instalação em um DaneDesk vinculado à sua conta.',loading:'Carregando catálogo…',all:'Todos',featured:'Destaques',categories:'Categorias',signin:'Entrar com GitHub',signed:'Sessão iniciada',noDevices:'Sua conta está pronta, mas ainda não há DaneDesk vinculado.',linkHint:'A licença pertence ao dispositivo, não à conta web. Inicie o vínculo no Foundstore Agent do DaneDesk para vê-lo aqui.',devices:'DaneDesk disponíveis',open:'Ver aplicativo',empty:'Nenhum aplicativo encontrado.',failed:'Não foi possível carregar o catálogo.'},ru:{browse:'Обзор',checking:'Проверка сеанса…',title:'Приложения для DaneDesk',subtitle:'Откройте каталог Fluthin, ознакомьтесь с приложением и запросите установку на DaneDesk, связанный с вашей учетной записью.',loading:'Загрузка каталога…',all:'Все',featured:'Рекомендуемое',categories:'Категории',signin:'Войти через GitHub',signed:'Вход выполнен',noDevices:'Учетная запись готова, но DaneDesk еще не связан.',linkHint:'Лицензия относится к устройству, а не к веб-учетной записи. Запустите привязку из Foundstore Agent на DaneDesk.',devices:'Доступные DaneDesk',open:'Открыть',empty:'Приложения не найдены.',failed:'Не удалось загрузить каталог.'}};
      let locale=localStorage.getItem('foundstore-language')||((country==='RU')?'ru':(country==='BR'||country==='PT')?'pt':(navigator.language||'es').slice(0,2));if(!words[locale])locale='es';let active='all',activePlatform='all',packages=[],devices=[];language.value=locale;const platformWords={es:{all:'Todas las plataformas',Danenone:'Danenone',Knosthalij:'Knosthalij'},en:{all:'All platforms',Danenone:'Danenone',Knosthalij:'Knosthalij'},pt:{all:'Todas as plataformas',Danenone:'Danenone',Knosthalij:'Knosthalij'},ru:{all:'Все платформы',Danenone:'Danenone',Knosthalij:'Knosthalij'}};const t=k=>words[locale][k]||words.es[k];const tp=k=>platformWords[locale][k]||platformWords.es[k];const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      function translate(){document.documentElement.lang=locale;document.querySelectorAll('[data-i18n]').forEach(n=>n.textContent=t(n.dataset.i18n));search.placeholder=t('browse')+'…'}
      function updateAccount(){if(!window.signedIn){account.innerHTML=`<a href="/auth/github/login">${t('signin')}</a>`;return}if(!devices.length){account.innerHTML=`<a href="/profile"><strong>${t('signed')}</strong> · Perfil</a>`;status.innerHTML=`<strong>${t('noDevices')}</strong><span>${t('linkHint')}</span>`;status.classList.add('show');return}account.innerHTML=`<a href="/profile"><strong>${t('signed')}</strong> · ${devices.length} ${t('devices')}</a>`;status.classList.remove('show')}
      function categories(){const values=['all',...new Set(packages.map(p=>p.category||'Fluthin'))];document.getElementById('categoryNav').innerHTML=values.map(value=>`<button class="${value===active?'active':''}" data-category="${esc(value)}"><span class="nav-dot"></span>${value==='all'?t('all'):esc(value)}</button>`).join('');document.getElementById('filters').innerHTML=values.slice(0,5).map(value=>`<button class="chip ${value===active?'active':''}" data-category="${esc(value)}">${value==='all'?t('all'):esc(value)}</button>`).join('');document.getElementById('platformFilters').innerHTML=['all','Danenone','Knosthalij'].map(value=>`<button class="chip ${value===activePlatform?'active':''}" data-platform="${value}">${tp(value)}</button>`).join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{active=b.dataset.category;categories();render()});document.querySelectorAll('[data-platform]').forEach(b=>b.onclick=()=>{activePlatform=b.dataset.platform;categories();render()})}
      function render(){const term=search.value.trim().toLowerCase();const visible=packages.filter(p=>(active==='all'||(p.category||'Fluthin')===active)&&(activePlatform==='all'||(p.platformTargets||[]).includes(activePlatform))&&`${p.name} ${p.description||''} ${(p.tags||[]).join(' ')}`.toLowerCase().includes(term));notice.textContent=`${visible.length} ${t('categories').toLowerCase()}`;catalogNode.innerHTML=visible.length?visible.map(p=>`<article class="card"><div class="art"><img src="${esc((p.visuals||{}).splash||'')}" alt="" loading="lazy" onerror="this.remove()"><span class="art-fallback">${esc(p.name).slice(0,1).toUpperCase()}</span></div><div><div class="category">${esc(p.category||'Fluthin')}</div><h2>${esc(p.name)}</h2><div class="targets">${(p.platformTargets||[]).map(target=>`<span class="target">${esc(target)}</span>`).join('')}</div><p>${esc(p.description||'Fluthin application for Danenone.')}</p><div class="meta"><span class="category">${esc(p.author||owner)}</span><a class="open" href="/${encodeURIComponent(p.author||owner)}/${encodeURIComponent(p.slug)}">${t('open')}</a></div></div></article>`).join(''):`<div class="empty">${t('empty')}</div>`}
      async function start(){translate();try{const [me,catalog]=await Promise.all([fetch('/api/v1/me/devices'),fetch('/api/v1/catalog')]);window.signedIn=me.ok;devices=me.ok?(await me.json()).devices||[]:[];packages=catalog.ok?(await catalog.json()).packages||[]:[];updateAccount();categories();render()}catch(_){catalogNode.innerHTML=`<div class="empty">${t('failed')}</div>`}}language.onchange=()=>{locale=language.value;localStorage.setItem('foundstore-language',locale);translate();updateAccount();categories();render()};search.oninput=render;start();
    </script>
  </body>
</html>
