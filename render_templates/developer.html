    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef4ff;background:#0a0e17}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 86% 5%,rgba(73,96,169,.46),transparent 31rem),radial-gradient(circle at 7% 86%,rgba(12,142,85,.25),transparent 33rem),linear-gradient(145deg,#090e16,#121a2c 56%,#0b101b)}a{color:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:26px 0 66px}.nav{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#f4f7ff;font-size:20px;font-weight:880;letter-spacing:-.04em}.mark{width:31px;height:31px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#5de7a6,#168d58);color:#0a291a;font-size:10px;box-shadow:0 11px 25px rgba(7,164,91,.26)}.back,.follow{border:1px solid rgba(151,172,213,.38);border-radius:11px;background:rgba(20,28,46,.6);color:#dce7fa;box-shadow:inset 0 1px rgba(255,255,255,.08),0 8px 22px rgba(0,0,0,.15);backdrop-filter:blur(18px) saturate(145%);font:inherit;font-weight:800;text-decoration:none;padding:9px 13px;cursor:pointer;transition:transform .16s cubic-bezier(.23,1,.32,1),border-color .16s,background .16s}.back:hover,.follow:hover{border-color:rgba(117,240,181,.6)}.follow{color:#9affc8;border-color:rgba(96,234,165,.42);background:rgba(9,130,75,.13)}.follow.following{color:#d8e5f9;background:rgba(38,49,76,.68);border-color:rgba(151,172,213,.42)}.follow:active{transform:scale(.97)}.vibrant{background:linear-gradient(145deg,rgba(34,44,71,.8),rgba(15,22,38,.78));border:1px solid rgba(159,181,223,.25);box-shadow:inset 0 1px rgba(255,255,255,.1),0 24px 58px rgba(0,0,0,.25);backdrop-filter:blur(22px) saturate(155%)}.hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:23px;align-items:center;padding:30px;margin:40px 0 28px;border-radius:25px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:auto -60px -90px auto;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(73,231,161,.16),transparent 66%);pointer-events:none}.avatar-wrap{width:92px;height:92px;position:relative;flex:none}.avatar{width:100%;height:100%;border-radius:26px;object-fit:cover;border:1px solid rgba(255,255,255,.2);background:#16243d;display:block}.avatar-fallback{position:absolute;inset:0;display:grid;place-items:center;border-radius:26px;background:linear-gradient(135deg,#293d68,#1a724c);color:#e6fff1;font-size:34px;font-weight:900}.avatar-fallback[hidden]{display:none}.eyebrow{margin:0;color:#6fecae;font-size:11px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}.title{margin:8px 0 4px;font-size:clamp(32px,5vw,57px);letter-spacing:-.06em;line-height:.96}.handle,.bio,.count{margin:0;color:#aebdd2;line-height:1.55}.bio{margin-top:10px;max-width:690px}.links{display:flex;gap:11px;flex-wrap:wrap;margin-top:13px}.links a{color:#9affc8;font-size:14px;font-weight:800}.heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:22px 0 15px}.heading h2{margin:0;font-size:20px;letter-spacing:-.03em}.grid{display:grid;grid-template-columns:1fr;gap:16px}.card{display:grid;grid-template-columns:148px minmax(0,1fr);gap:16px;padding:16px;border-radius:19px;transition:transform .2s cubic-bezier(.23,1,.32,1),border-color .2s}.card:hover{transform:translateY(-3px);border-color:rgba(100,237,173,.45)}.art{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:12px;background:linear-gradient(135deg,#20335a,#0f6244);display:grid;place-items:center}.art img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover}.art-fallback{position:absolute;inset:0;display:grid;place-items:center;color:#c9f9df;font-size:29px;font-weight:900}.category{color:#a3b2c9;font-size:12px;font-weight:800}.card h3{margin:5px 0;color:#f4f7ff;font-size:20px;letter-spacing:-.035em;overflow-wrap:anywhere}.targets{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.target{padding:4px 7px;border:1px solid rgba(79,231,159,.25);border-radius:999px;background:rgba(8,136,77,.19);color:#91ffc4;font-size:11px;font-weight:850}.desc{margin:0;color:#b0bed2;font-size:14px;line-height:1.45}.open{display:inline-flex;margin-top:12px;padding:8px 10px;border:1px solid rgba(89,232,164,.45);border-radius:10px;color:#98ffc9;background:rgba(8,130,75,.12);font-size:13px;font-weight:800;text-decoration:none}.empty{grid-column:1/-1;border-radius:18px;padding:29px;color:#b4c2d6}.empty strong{display:block;color:#f2f6ff;margin-bottom:5px}@media(max-width:700px){.shell{width:min(100% - 24px,1180px);padding-top:19px}.nav{align-items:flex-start}.hero{grid-template-columns:auto minmax(0,1fr);padding:21px;gap:16px;margin:27px 0 23px}.hero .follow{grid-column:1/-1;width:100%;text-align:center}.avatar-wrap{width:62px;height:62px}.avatar,.avatar-fallback{border-radius:18px}.title{font-size:clamp(29px,9vw,45px)}.grid{grid-template-columns:1fr}.card{grid-template-columns:116px minmax(0,1fr)}.heading{align-items:flex-start;flex-direction:column}}@media(max-width:410px){.brand{font-size:18px}.back{font-size:12px;padding:8px}.card{grid-template-columns:1fr}.art{max-width:190px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(prefers-reduced-transparency:reduce){.vibrant,.back,.follow{backdrop-filter:none;background:#151d30}}
    </style>
    <style>.owner-status{border:1px solid rgba(124,190,255,.38);border-radius:11px;background:rgba(48,88,151,.18);box-shadow:inset 0 1px rgba(255,255,255,.08),0 8px 22px rgba(0,0,0,.15);backdrop-filter:blur(18px) saturate(145%);color:#a9d9ff;padding:9px 13px;font-weight:800;white-space:nowrap}@media(max-width:700px){.hero .owner-status{grid-column:1/-1;width:100%;text-align:center}}</style>
    <style>.mobile-dock{display:none}@media(max-width:700px){.shell{padding-bottom:88px}.mobile-dock{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:rgba(12,18,31,.94);border-top:1px solid rgba(151,172,213,.25);backdrop-filter:blur(18px)}.mobile-dock a{display:grid;place-items:center;gap:4px;color:#bac7dc;text-decoration:none;font-size:11px;font-weight:800}.mobile-dock a.active{color:#85ffc1}.mobile-dock svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}}</style>
    <style>@media(hover:none) and (pointer:coarse){.shell{padding-bottom:88px}.mobile-dock{position:fixed;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 18px calc(10px + env(safe-area-inset-bottom));background:rgba(12,18,31,.94);border-top:1px solid rgba(151,172,213,.25);backdrop-filter:blur(18px)}.mobile-dock a{display:grid;place-items:center;gap:4px;color:#bac7dc;text-decoration:none;font-size:11px;font-weight:800}.mobile-dock a.active{color:#85ffc1}.mobile-dock svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}}</style>
    <style>.mobile-dock{display:none!important}</style>
    <style>@media(max-width:700px){html,body{max-width:100%;overflow-x:hidden}.shell{width:calc(100% - 24px);max-width:100%;overflow-x:hidden}.hero,.grid,.card{min-width:0;max-width:100%}.card>*{min-width:0}.card h3,.desc,.handle,.bio{overflow-wrap:anywhere;word-break:break-word}.art{max-width:100%}}</style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/foundstore-components.css') }}"><script defer src="{{ url_for('static', filename='js/foundstore-motion.js') }}"></script>
    <script src="{{ url_for('static', filename='js/foundstore-components.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/foundstore-v2.css') }}?v=pwa4">
  </head>
  <body>
    <main class="shell"><nav class="nav">{{ foundstore_brand('brand') }}<a class="back" href="/">Volver al catálogo</a></nav><section class="hero vibrant" id="hero"><div class="avatar-wrap"><img class="avatar" id="avatar" alt="" hidden><span class="avatar-fallback" id="avatarFallback">?</span></div><div><p class="eyebrow">Perfil de desarrollador</p><h1 class="title" id="title">Cargando perfil…</h1><p class="handle" id="handle"></p><p class="bio" id="bio"></p><div class="links" id="links"></div></div><button class="follow" id="follow" type="button" disabled>Cargando…</button><span class="owner-status" id="ownerStatus" hidden>Tu perfil</span></section><section><div class="heading"><h2>Paquetes Fluthin publicados</h2><span class="count" id="count"></span></div><div class="grid" id="catalog"><div class="empty vibrant">Cargando catálogo del desarrollador…</div></div></section></main>
    <script>
      const login={{ github_login|tojson }},hero=document.getElementById('hero'),catalog=document.getElementById('catalog'),count=document.getElementById('count'),follow=document.getElementById('follow'),ownerStatus=document.getElementById('ownerStatus'),avatar=document.getElementById('avatar'),fallback=document.getElementById('avatarFallback'),esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));let signedIn=false,following=false,ownProfile=false,followerCount=0,followingCount=0,publishedPackages=0;
      function updateCount(){const followers=followerCount===null?'seguidores privados':`${followerCount} seguidor${followerCount===1?'':'es'}`,followingSummary=followingCount===null?'seguidos privados':`${followingCount} seguidos`;count.textContent=`${publishedPackages} paquetes · ${followers} · ${followingSummary}`}
      function showAvatar(profile){const initial=(profile.displayName||profile.githubName||profile.githubLogin||'?').slice(0,1).toUpperCase();fallback.textContent=initial;const fail=()=>{avatar.hidden=true;fallback.hidden=false};avatar.onerror=fail;const owner=profile.githubLogin||login;if(owner){avatar.src=`/assets/github-avatar/${encodeURIComponent(owner)}.png`;avatar.hidden=false;fallback.hidden=true}else fail()}
      function renderProfile(profile,nextFollowerCount,nextFollowingCount,visibility){showAvatar(profile);document.getElementById('title').textContent=profile.displayName||profile.githubName||profile.githubLogin;document.getElementById('handle').textContent=`@${profile.githubLogin||login}`;document.getElementById('bio').textContent=profile.bio||(visibility?.bio===false?'La biografía de este perfil es privada.':'Desarrollador de paquetes Fluthin para Foundstore.');const links=document.getElementById('links');links.innerHTML=`<a href="${esc(profile.githubUrl||`https://github.com/${profile.githubLogin}`)}" rel="noopener noreferrer" target="_blank">GitHub</a>${profile.website?`<a href="${esc(profile.website)}" rel="noopener noreferrer" target="_blank">Sitio web</a>`:''}`;followerCount=nextFollowerCount===null?null:Number(nextFollowerCount)||0;followingCount=nextFollowingCount===null?null:Number(nextFollowingCount)||0;updateCount()}
      function renderFollow(){ownerStatus.hidden=!ownProfile;follow.hidden=ownProfile;if(ownProfile)return;follow.disabled=false;if(!signedIn){follow.textContent='Inicia sesión para seguir';follow.classList.remove('following');return}follow.textContent=following?'Siguiendo':'Seguir desarrollador';follow.classList.toggle('following',following)}
      function renderCatalog(packages,visibility){publishedPackages=packages.length;updateCount();catalog.innerHTML=packages.length?packages.map(item=>FoundstoreUI.creatorPackageRow(item)).join(''):`<div class="empty vibrant"><strong>${visibility?.repositories===false?'Los repositorios de este perfil son privados.':'Este perfil aún no tiene paquetes publicados.'}</strong>${visibility?.repositories===false?'El propietario decidió restringir el inventario de paquetes.':'Cuando el repositorio público cumpla la estructura Packagemaker, sus paquetes aparecerán aquí.'}</div>`}
      async function setFollow(){if(!signedIn){location.href='/auth/github/login';return}follow.disabled=true;try{const response=await fetch(`/api/v1/me/following/${encodeURIComponent(login)}`,{method:following?'DELETE':'POST'}),data=await response.json();if(!response.ok)throw new Error(data.error||'No se pudo actualizar el seguimiento');following=data.following;followerCount=Number(data.followerCount)||0;updateCount()}catch(error){follow.textContent=error.message}finally{renderFollow()}}
      async function start(){try{const me=await fetch('/api/v1/me/following');signedIn=me.ok;const response=await fetch(`/api/v1/developers/${encodeURIComponent(login)}`),data=await response.json();if(!response.ok)throw new Error();following=Boolean(data.following);ownProfile=Boolean(data.isOwnProfile);renderProfile(data.profile,data.followerCount,data.followingCount,data.visibility);renderCatalog(data.catalogAvailable?(data.catalog?.packages||[]):[],data.visibility);renderFollow()}catch(_){catalog.innerHTML='<div class="empty vibrant"><strong>No se pudo cargar este perfil.</strong>Vuelve a intentarlo más tarde.</div>';follow.textContent='Perfil no disponible'}}follow.onclick=setFollow;start();
    </script>
  </body>
</html>
