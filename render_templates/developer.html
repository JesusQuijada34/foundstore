<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Desarrollador · Foundstore</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#edf4ff;background:#0c101b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 84% 4%,rgba(53,74,145,.45),transparent 31rem),radial-gradient(circle at 8% 96%,rgba(10,131,79,.22),transparent 34rem),linear-gradient(145deg,#090e17,#131a2a 55%,#0c111b)}a{color:inherit}.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:28px 0 66px}.nav{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand,.back{font-weight:850;text-decoration:none}.brand{display:flex;gap:10px;align-items:center;font-size:20px}.mark{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#42df93,#168a58);color:#0e281c;font-size:11px}.back,.open{border:1px solid rgba(98,232,168,.42);background:rgba(11,122,73,.11);color:#9affc8;border-radius:11px;padding:9px 12px;font-size:14px}.hero,.card,.empty{background:linear-gradient(145deg,rgba(30,39,64,.84),rgba(16,23,39,.82));border:1px solid rgba(151,172,213,.25);box-shadow:inset 0 1px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.22)}.hero{display:flex;gap:24px;align-items:center;padding:28px;margin:42px 0 23px;border-radius:23px}.avatar{width:88px;height:88px;border-radius:24px;background:#17223a;object-fit:cover}.avatar.fallback{display:grid;place-items:center;font-weight:900;color:#a7badb;font-size:28px}.eyebrow{margin:0;color:#61e9a7;text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:850}.title{margin:8px 0 7px;letter-spacing:-.055em;font-size:clamp(32px,5vw,56px);line-height:.95}.handle,.bio{color:#aebcd0;margin:0;line-height:1.55}.bio{margin-top:10px;max-width:700px}.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.links a{color:#93ffc6;font-weight:750}.heading{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:26px 0 14px}.heading h2{margin:0;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.card{display:grid;grid-template-columns:145px minmax(0,1fr);gap:16px;padding:17px;border-radius:18px}.splash{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:#1b2841}.category{color:#9fadc4;font-size:12px;font-weight:800}.card h3{margin:5px 0;color:#f3f6ff;font-size:20px;letter-spacing:-.03em}.desc{color:#b0bed2;line-height:1.45;font-size:14px}.targets{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.target{font-size:11px;padding:4px 7px;border-radius:99px;color:#99ffd0;background:rgba(7,136,78,.2);border:1px solid rgba(80,230,159,.24);font-weight:800}.open{display:inline-block;text-decoration:none;font-weight:800;margin-top:5px}.empty{padding:28px;border-radius:18px;color:#b7c4d8;grid-column:1/-1}.empty strong{color:#f2f6ff;display:block;margin-bottom:5px}@media(max-width:650px){.shell{width:min(100% - 26px,1120px)}.hero{align-items:flex-start;flex-direction:column;padding:22px;margin-top:28px}.grid{grid-template-columns:1fr}.card{grid-template-columns:1fr}.splash{max-width:220px}.nav{align-items:flex-start;flex-direction:column}}
    </style>
  </head>
  <body>
    <main class="shell"><nav class="nav"><a class="brand" href="/"><span class="mark">FD</span>Foundstore</a><a class="back" href="/">Volver al catálogo</a></nav><section class="hero" id="hero"><span class="avatar fallback">…</span><div><p class="eyebrow">Perfil de desarrollador</p><h1 class="title">Cargando perfil…</h1></div></section><section><div class="heading"><h2>Paquetes Fluthin publicados</h2><span id="count" class="category"></span></div><div class="grid" id="catalog"><div class="empty">Cargando catálogo del desarrollador…</div></div></section></main>
    <script>
      const login={{ github_login|tojson }},hero=document.getElementById('hero'),catalog=document.getElementById('catalog'),count=document.getElementById('count'),esc=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      function renderProfile(profile){const avatar=profile.avatarUrl?`<img class="avatar" src="${esc(profile.avatarUrl)}" alt="">`:`<span class="avatar fallback">${esc((profile.displayName||profile.githubLogin||'?').slice(0,1).toUpperCase())}</span>`;hero.innerHTML=`${avatar}<div><p class="eyebrow">Perfil de desarrollador</p><h1 class="title">${esc(profile.displayName||profile.githubName)}</h1><p class="handle">@${esc(profile.githubLogin)}</p>${profile.bio?`<p class="bio">${esc(profile.bio)}</p>`:''}<div class="links"><a href="${esc(profile.githubUrl)}" rel="noopener noreferrer" target="_blank">GitHub</a>${profile.website?`<a href="${esc(profile.website)}" rel="noopener noreferrer" target="_blank">Sitio web</a>`:''}</div></div>`}
      function renderCatalog(packages){count.textContent=`${packages.length} paquetes`;catalog.innerHTML=packages.length?packages.map(item=>`<article class="card"><img class="splash" src="${esc((item.visuals||{}).splash||'')}" alt="" loading="lazy"><div><div class="category">${esc(item.category||'Fluthin')}</div><h3>${esc(item.name)}</h3><div class="targets">${(item.platformTargets||[]).map(value=>`<span class="target">${esc(value)}</span>`).join('')}</div><p class="desc">${esc(item.description||'Aplicación Fluthin')}</p><a class="open" href="/${encodeURIComponent(item.author)}/${encodeURIComponent(item.slug)}">Ver ficha</a></div></article>`).join(''):'<div class="empty"><strong>Este perfil aún no tiene paquetes publicados.</strong>Cuando exista un repositorio público con `repo.list`, los paquetes aparecerán aquí.</div>'}
      async function start(){try{const response=await fetch(`/api/v1/developers/${encodeURIComponent(login)}`),data=await response.json();if(!response.ok)throw new Error();renderProfile(data.profile);if(data.catalogAvailable)renderCatalog(data.catalog.packages||[]);else{count.textContent='';catalog.innerHTML='<div class="empty"><strong>No se encontró el catálogo público.</strong>Configura un repositorio llamado `catalog` que incluya el archivo `repo.list`.</div>'}}catch(_){catalog.innerHTML='<div class="empty"><strong>No se pudo cargar este perfil.</strong>Vuelve a intentarlo más tarde.</div>'}}start();
    </script>
  </body>
</html>
