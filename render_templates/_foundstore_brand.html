{% macro foundstore_brand(class_name='brand') -%}
<div class="foundstore-brand-wrap"><a class="{{ class_name }} foundstore-brand" href="/" aria-label="Ir al catálogo de Foundstore"><span class="foundstore-brand-icon"><img class="foundstore-brand-logo" src="{{ url_for('static', filename='foundstore-mark.svg') }}" data-legacy-asset="foundstore-discovery-mark-solid_515e468d.png" alt="Marca de Foundstore"></span><span class="foundstore-brand-word">Foundstore</span></a><label class="foundstore-language-label"><span class="visually-hidden">{{ t('Language') }}</span><select class="foundstore-language" data-language-selector aria-label="{{ t('Choose language') }}"><option value="auto"{% if locale_preference == 'auto' %} selected{% endif %}>Auto · {{ current_locale|upper }}</option>{% for code, name in available_locales.items() %}<option value="{{ code }}"{% if code == locale_preference %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></label></div><script src="/static/js/foundstore-translations.js?v=i18n4"></script><script src="/static/js/foundstore-i18n.js?v=i18n4" defer></script><script src="/static/js/foundstore-theme.js?v=theme3" defer></script>
{%- endmacro %}
