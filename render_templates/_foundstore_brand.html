{% macro foundstore_brand(class_name='brand') -%}
<div class="foundstore-brand-wrap"><a class="{{ class_name }} foundstore-brand" href="/" aria-label="Ir al catálogo de Foundstore"><span class="foundstore-brand-icon"><img class="foundstore-brand-logo" src="https://3000-i5g3cl1vlppg0grz4dtbt-a6ddeb21.us4.manus.computer/manus-storage/foundstore-discovery-mark-solid_515e468d.png" alt=""></span><span class="foundstore-brand-word">Foundstore</span></a><label class="foundstore-language-label"><span class="visually-hidden">{{ t('Language') }}</span><select class="foundstore-language" data-language-selector aria-label="{{ t('Choose language') }}">{% for code, name in available_locales.items() %}<option value="{{ code }}"{% if code == current_locale %} selected{% endif %}>{{ name }}</option>{% endfor %}</select></label></div><script src="/static/js/foundstore-i18n.js" defer></script>
{%- endmacro %}
