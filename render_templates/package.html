<!doctype html>
<html lang="es" data-country="{{ visitor_country }}">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ package.name }} · Foundstore</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15231c;background:#eef4f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 4%,#c2f2d2 0,transparent 26%),linear-gradient(135deg,#f6f9f7,#e6efe9)}.bar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);border-bottom:1px solid #d6e1d9;background:#ffffffbd;backdrop-filter:blur(16px)}.brand,.back{display:flex;gap:10px;align-items:center;font-weight:800;text-decoration:none;color:#193226}.cube{width:28px;height:28px;border-radius:9px;background:#0d8c57;color:white;display:grid;place-items:center;font-size:11px}.back{font-size:14px;color:#097c4b}.lang{border:1px solid #d3ded7;background:white;border-radius:9px;padding:7px;color:#24382b}.page{width:min(1040px,calc(100% - 36px));margin:56px auto}.detail{display:grid;grid-template-columns:minmax(260px,.83fr) minmax(0,1.3fr);gap:42px;padding:clamp(26px,5vw,56px);background:#ffffffd9;border:1px solid #dbe6df;border-radius:30px;box-shadow:0 34px 80px #1c48301c;animation:appear .45s cubic-bezier(.2,.8,.2,1) both}.visual{min-height:290px;border-radius:24px;background:linear-gradient(145deg,#d8f7e2,#77dca5 52%,#14945a);padding:23px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.visual:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#ffffff55;right:-105px;top:-85px}.mark{width:98px;height:98px;border-radius:25px;background:#ffffffea;display:grid;place-items:center;font-size:43px;color:#087345;font-weight:900;box-shadow:0 15px 35px #0b6e4233;z-index:1}.visual small{color:#074c31;font-weight:800;letter-spacing:.08em;text-transform:uppercase;z-index:1}.eyebrow{color:#128355;font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.1em}.title{font-size:clamp(36px,6vw,66px);letter-spacing:-.065em;line-height:.95;margin:12px 0}.desc{color:#61756a;line-height:1.65;font-size:16px;max-width:640px}.facts{display:flex;gap:22px;margin:26px 0;color:#537062;font-size:14px}.facts strong{display:block;color:#1c3226;font-size:15px;margin-bottom:3px}.install{padding:18px;border-radius:18px;border:1px solid #cfe1d6;background:#f3faf5}.install h2{font-size:18px;margin:0 0 6px}.install p{color:#63766b;font-size:14px;line-height:1.5;margin:0 0 14px}.row{display:flex;gap:10px;flex-wrap:wrap}select{flex:1;min-width:190px;border:1px solid #c8d9cf;background:white;color:#24362b;padding:11px;border-radius:11px}button,.signin{border:0;border-radius:11px;background:#0d9159;color:white;padding:11px 15px;font-weight:800;text-decoration:none;cursor:pointer}.signin{display:inline-flex}.result{margin-top:13px;min-height:20px;color:#087a4a;font-size:14px;font-weight:700}.result.error{color:#b83a35}.link-help{margin-top:18px;padding-top:16px;border-top:1px solid #d9e7de;color:#61756a;font-size:14px;line-height:1.5}.link-help strong{color:#213d2c}@keyframes appear{from{opacity:0;transform:scale(.96) translateY(18px)}to{opacity:1;transform:none}}@media(max-width:760px){.page{margin:25px auto}.detail{grid-template-columns:1fr;gap:25px;border-radius:22px}.visual{min-height:210px}.title{font-size:45px}.bar{padding:0 18px}}
    </style>
  </head>
  <body>
    <header class="bar"><a class="brand" href="/"><span class="cube">FD</span><span>Foundstore</span></a><a class="back" href="/" id="back">← <span data-i18n="back">Catálogo</span></a><select class="lang" id="language"><option value="es">ES</option><option value="en">EN</option><option value="pt">PT</option><option value="ru">RU</option></select></header>
    <main class="page"><article class="detail"><section class="visual"><div class="mark" id="mark"></div><small id="platform">Influent · Danenone</small></section><section><div class="eyebrow" id="category"></div><h1 class="title" id="name"></h1><p class="desc" id="description"></p><div class="facts"><div><strong data-i18n="platform">Plataforma</strong><span>Danenone</span></div><div><strong data-i18n="publisher">Publicador</strong><span id="author"></span></div><div><strong data-i18n="delivery">Entrega</strong><span data-i18n="remote">Remota y aprobada</span></div></div><section class="install" id="install"><h2 data-i18n="installTitle">Instalar en DaneDesk</h2><p id="installText"></p><div class="row" id="installControls"></div><div class="result" id="result" aria-live="polite"></div><div class="link-help" id="linkHelp"></div></section></section></article></main>
    <script>
      const pkg={{ package|tojson }},country=document.documentElement.dataset.country||'',language=document.getElementById('language'),controls=document.getElementById('installControls'),text=document.getElementById('installText'),help=document.getElementById('linkHelp'),result=document.getElementById('result');
      const copy={es:{back:'Catálogo',platform:'Plataforma',publisher:'Publicador',delivery:'Entrega',remote:'Remota y aprobada',installTitle:'Instalar en DaneDesk',signed:'Elige un DaneDesk vinculado. La aplicación se solicitará; el dispositivo siempre pedirá aprobación local.',signin:'Inicia sesión con GitHub para elegir dónde instalar esta aplicación.',sign:'Iniciar sesión con GitHub',noDevice:'Tu sesión está iniciada, pero no hay DaneDesk vinculados.',link:'La licencia es del dispositivo, no de tu cuenta web. Ejecuta `foundstore-agent license-link <LICENCIA>` en el DaneDesk para iniciar el vínculo y confírmalo desde la página que abre el agente.',select:'Selecciona un DaneDesk',request:'Solicitar instalación',sent:'Solicitud enviada. Confirma la instalación desde el DaneDesk.',choose:'Selecciona un DaneDesk antes de solicitar la instalación.',failed:'No se pudo crear la solicitud.',category:'Fluthin'},en:{back:'Catalog',platform:'Platform',publisher:'Publisher',delivery:'Delivery',remote:'Remote and approved',installTitle:'Install on DaneDesk',signed:'Choose a linked DaneDesk. The request is sent to the device, which always asks for local approval.',signin:'Sign in with GitHub to choose where this app will be installed.',sign:'Sign in with GitHub',noDevice:'You are signed in, but no DaneDesk is linked yet.',link:'The license belongs to the device, not your web account. Run `foundstore-agent license-link <LICENSE>` on the DaneDesk and approve the link in the page opened by the agent.',select:'Choose a DaneDesk',request:'Request installation',sent:'Request sent. Confirm the installation on the DaneDesk.',choose:'Choose a DaneDesk before requesting the installation.',failed:'The request could not be created.',category:'Fluthin'},pt:{back:'Catálogo',platform:'Plataforma',publisher:'Publicador',delivery:'Entrega',remote:'Remota e aprovada',installTitle:'Instalar no DaneDesk',signed:'Escolha um DaneDesk vinculado. O dispositivo sempre pedirá aprovação local.',signin:'Entre com GitHub para escolher onde instalar este aplicativo.',sign:'Entrar com GitHub',noDevice:'A sessão está ativa, mas não há DaneDesk vinculado.',link:'A licença pertence ao dispositivo. Execute `foundstore-agent license-link <LICENÇA>` no DaneDesk e aprove o vínculo na página aberta pelo agente.',select:'Selecione um DaneDesk',request:'Solicitar instalação',sent:'Solicitação enviada. Confirme no DaneDesk.',choose:'Selecione um DaneDesk antes de solicitar.',failed:'Não foi possível criar a solicitação.',category:'Fluthin'},ru:{back:'Каталог',platform:'Платформа',publisher:'Издатель',delivery:'Доставка',remote:'Удаленно с подтверждением',installTitle:'Установить на DaneDesk',signed:'Выберите связанный DaneDesk. Устройство всегда запросит локальное подтверждение.',signin:'Войдите через GitHub, чтобы выбрать устройство.',sign:'Войти через GitHub',noDevice:'Вы вошли, но DaneDesk еще не связан.',link:'Лицензия принадлежит устройству. Выполните `foundstore-agent license-link <ЛИЦЕНЗИЯ>` на DaneDesk и подтвердите связь на открытой странице.',select:'Выберите DaneDesk',request:'Запросить установку',sent:'Запрос отправлен. Подтвердите установку на DaneDesk.',choose:'Сначала выберите DaneDesk.',failed:'Не удалось создать запрос.',category:'Fluthin'}};
      let locale=localStorage.getItem('foundstore-language')||((country==='RU')?'ru':(country==='BR'||country==='PT')?'pt':(navigator.language||'es').slice(0,2));if(!copy[locale])locale='es';let devices=[];language.value=locale;const t=k=>copy[locale][k]||copy.es[k],esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      function translate(){document.documentElement.lang=locale;document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=t(node.dataset.i18n));document.getElementById('category').textContent=pkg.category||t('category');document.getElementById('name').textContent=pkg.name;document.getElementById('mark').textContent=(pkg.name||'F').slice(0,1).toUpperCase();document.getElementById('description').textContent=pkg.description||t('category');document.getElementById('author').textContent=pkg.author}
      function showControls(signed){if(!signed){text.textContent=t('signin');controls.innerHTML=`<a class="signin" href="/auth/github/login">${t('sign')}</a>`;help.textContent='';return}if(!devices.length){text.textContent=t('noDevice');controls.innerHTML='';help.innerHTML=`<strong>${t('link')}</strong>`;return}text.textContent=t('signed');controls.innerHTML=`<select id="device"><option value="">${t('select')}</option>${devices.map(d=>`<option value="${esc(d.id)}">${esc(d.displayName)} · ${esc(d.status)}</option>`).join('')}</select><button id="request">${t('request')}</button>`;document.getElementById('request').onclick=requestInstall;help.textContent=''}
      async function requestInstall(){const id=document.getElementById('device').value;if(!id){result.textContent=t('choose');result.className='result error';return}result.textContent='…';result.className='result';const response=await fetch(`/api/v1/me/devices/${encodeURIComponent(id)}/installations`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:pkg.slug})});const data=await response.json();if(!response.ok){result.textContent=data.error||t('failed');result.className='result error';return}result.textContent=t('sent')}
      async function start(){translate();const response=await fetch('/api/v1/me/devices');const signed=response.ok;devices=signed?(await response.json()).devices||[]:[];showControls(signed)}language.onchange=()=>{locale=language.value;localStorage.setItem('foundstore-language',locale);translate();showControls(true)};start();
    </script>
  </body>
</html>
