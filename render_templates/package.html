<!doctype html>
<html lang="es" data-country="{{ visitor_country }}">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ package.name }} · Foundstore</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15231c;background:#eef4f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 12% 4%,#c2f2d2 0,transparent 26%),linear-gradient(135deg,#f6f9f7,#e6efe9)}.bar{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);border-bottom:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.62);backdrop-filter:blur(16px) saturate(130%)}.brand,.back{display:flex;gap:10px;align-items:center;font-weight:800;text-decoration:none;color:#193226}.cube{width:28px;height:28px;border-radius:9px;background:#0d8c57;color:white;display:grid;place-items:center;font-size:11px}.back{font-size:14px;color:#097c4b}.back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.lang{border:1px solid rgba(255,255,255,.82);background:rgba(255,255,255,.62);border-radius:9px;padding:7px;color:#24382b}.page{width:min(1040px,calc(100% - 36px));margin:56px auto}.detail{min-width:0;display:grid;grid-template-columns:minmax(260px,.83fr) minmax(0,1.3fr);gap:42px;padding:clamp(26px,5vw,56px);background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.82);border-radius:30px;box-shadow:0 34px 80px #1c48301c,inset 0 1px rgba(255,255,255,.62);backdrop-filter:blur(16px) saturate(130%);animation:appear .45s cubic-bezier(.2,.8,.2,1) both}.detail>section{min-width:0}.visual{min-height:430px;border-radius:24px;background:linear-gradient(145deg,#d8f7e2,#77dca5 52%,#14945a);padding:23px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.portrait{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0a402122,rgba(8,55,34,.66));pointer-events:none}.mark{width:98px;height:98px;border-radius:25px;background:#ffffffea;display:grid;place-items:center;font-size:43px;color:#087345;font-weight:900;box-shadow:0 15px 35px #0b6e4233;z-index:1;overflow:hidden}.mark img{width:100%;height:100%;object-fit:cover}.visual small{color:white;font-weight:800;letter-spacing:.08em;text-transform:uppercase;z-index:1;text-shadow:0 2px 9px #062e1c}.eyebrow{color:#128355;font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.1em}.title{overflow-wrap:anywhere;font-size:clamp(36px,6vw,66px);letter-spacing:-.065em;line-height:.95;margin:12px 0}.desc{color:#61756a;line-height:1.65;font-size:16px;max-width:640px}.facts{display:flex;gap:22px;margin:26px 0;color:#537062;font-size:14px}.facts strong{display:block;color:#1c3226;font-size:15px;margin-bottom:3px}.targets{display:flex;gap:6px;flex-wrap:wrap}.target{padding:4px 8px;border-radius:999px;background:#e1f4e8;color:#087a4a;font-size:12px;font-weight:800}.install,.readme{padding:18px;border-radius:18px;border:1px solid rgba(255,255,255,.85);background:rgba(243,250,245,.64);box-shadow:inset 0 1px rgba(255,255,255,.48);backdrop-filter:blur(16px) saturate(130%)}.install h2,.readme h2{font-size:18px;margin:0 0 6px}.install p{color:#63766b;font-size:14px;line-height:1.5;margin:0 0 14px}.row{display:flex;gap:10px;flex-wrap:wrap}select{flex:1;min-width:0;border:1px solid rgba(200,217,207,.9);background:rgba(255,255,255,.72);color:#24362b;padding:11px;border-radius:11px}button,.signin{border:0;border-radius:11px;background:#0d9159;color:white;padding:11px 15px;font-weight:800;text-decoration:none;cursor:pointer}.signin{display:inline-flex}.result{margin-top:13px;min-height:20px;color:#087a4a;font-size:14px;font-weight:700}.result.error{color:#b83a35}.link-help{margin-top:18px;padding-top:16px;border-top:1px solid #d9e7de;color:#61756a;font-size:14px;line-height:1.5}.link-help strong{color:#213d2c}.readme{margin-top:18px}.readme pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;margin:12px 0 0;color:#486256;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}@keyframes appear{from{opacity:0;transform:scale(.96) translateY(18px)}to{opacity:1;transform:none}}@media(max-width:900px){.page{margin:30px auto}.detail{grid-template-columns:minmax(230px,.7fr) 1.3fr;gap:26px;padding:28px}.visual{min-height:360px}}@media(max-width:700px){.page{margin:20px auto}.detail{grid-template-columns:1fr;gap:25px;border-radius:22px;padding:22px}.visual{min-height:320px}.title{font-size:45px}.bar{padding:0 18px}.facts{gap:14px;flex-wrap:wrap}}@media(max-width:420px){.bar{height:62px}.brand span:last-child{display:none}.back span{display:none}.page{width:min(100% - 22px,1040px)}.visual{min-height:275px}.title{font-size:38px}.facts{font-size:12px}}
    </style>
  </head>
  <body>
    <header class="bar"><a class="brand" href="/"><span class="cube">FD</span><span>Foundstore</span></a><a class="back" href="/" id="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg><span data-i18n="back">Catálogo</span></a><select class="lang" id="language"><option value="es">ES</option><option value="en">EN</option><option value="pt">PT</option><option value="ru">RU</option></select></header>
    <main class="page"><article class="detail"><section class="visual"><img class="portrait" id="portrait" alt="" loading="eager"><div class="mark" id="mark"></div><small id="platform">Influent · Danenone</small></section><section><div class="eyebrow" id="category"></div><h1 class="title" id="name"></h1><p class="desc" id="description"></p><div class="facts"><div><strong data-i18n="platform">Plataforma</strong><span class="targets" id="platformTargets"></span></div><div><strong data-i18n="publisher">Publicador</strong><span id="author"></span></div><div><strong data-i18n="delivery">Entrega</strong><span data-i18n="remote">Remota y aprobada</span></div></div><section class="install" id="install"><h2 data-i18n="installTitle">Instalar en DaneDesk</h2><p id="installText"></p><div class="row" id="installControls"></div><div class="result" id="result" aria-live="polite"></div><div class="link-help" id="linkHelp"></div></section><section class="readme" id="readmeSection"><h2 data-i18n="readme">README del paquete</h2><pre id="readme"></pre></section></section></article></main>
    <script>
      const pkg={{ package|tojson }},country=document.documentElement.dataset.country||'',language=document.getElementById('language'),controls=document.getElementById('installControls'),text=document.getElementById('installText'),help=document.getElementById('linkHelp'),result=document.getElementById('result');
      const copy={es:{back:'Catálogo',platform:'Plataforma',publisher:'Publicador',delivery:'Entrega',remote:'Remota y aprobada',installTitle:'Instalar en DaneDesk',readme:'README del paquete',signed:'Elige un DaneDesk vinculado. La aplicación se solicitará; el dispositivo siempre pedirá aprobación local.',signin:'Inicia sesión con GitHub para elegir dónde instalar esta aplicación.',sign:'Iniciar sesión con GitHub',noDevice:'Tu sesión está iniciada, pero no hay DaneDesk vinculados.',link:'La licencia es del dispositivo, no de tu cuenta web. Ejecuta `foundstore-agent license-link <LICENCIA>` en el DaneDesk para iniciar el vínculo y confírmalo desde la página que abre el agente.',select:'Selecciona un DaneDesk',request:'Solicitar instalación',sent:'Solicitud enviada. Confirma la instalación desde el DaneDesk.',choose:'Selecciona un DaneDesk antes de solicitar la instalación.',failed:'No se pudo crear la solicitud.',category:'Fluthin'},en:{back:'Catalog',platform:'Platform',publisher:'Publisher',delivery:'Delivery',remote:'Remote and approved',installTitle:'Install on DaneDesk',readme:'Package README',signed:'Choose a linked DaneDesk. The request is sent to the device, which always asks for local approval.',signin:'Sign in with GitHub to choose where this app will be installed.',sign:'Sign in with GitHub',noDevice:'You are signed in, but no DaneDesk is linked yet.',link:'The license belongs to the device, not your web account. Run `foundstore-agent license-link <LICENSE>` on the DaneDesk and approve the link in the page opened by the agent.',select:'Choose a DaneDesk',request:'Request installation',sent:'Request sent. Confirm the installation on the DaneDesk.',choose:'Choose a DaneDesk before requesting the installation.',failed:'The request could not be created.',category:'Fluthin'},pt:{back:'Catálogo',platform:'Plataforma',publisher:'Publicador',delivery:'Entrega',remote:'Remota e aprovada',installTitle:'Instalar no DaneDesk',readme:'README do pacote',signed:'Escolha um DaneDesk vinculado. O dispositivo sempre pedirá aprovação local.',signin:'Entre com GitHub para escolher onde instalar este aplicativo.',sign:'Entrar com GitHub',noDevice:'A sessão está ativa, mas não há DaneDesk vinculado.',link:'A licença pertence ao dispositivo. Execute `foundstore-agent license-link <LICENÇA>` no DaneDesk e aprove o vínculo na página aberta pelo agente.',select:'Selecione um DaneDesk',request:'Solicitar instalação',sent:'Solicitação enviada. Confirme no DaneDesk.',choose:'Selecione um DaneDesk antes de solicitar.',failed:'Não foi possível criar a solicitação.',category:'Fluthin'},ru:{back:'Каталог',platform:'Платформа',publisher:'Издатель',delivery:'Доставка',remote:'Удаленно с подтверждением',installTitle:'Установить на DaneDesk',readme:'README пакета',signed:'Выберите связанный DaneDesk. Устройство всегда запросит локальное подтверждение.',signin:'Войдите через GitHub, чтобы выбрать устройство.',sign:'Войти через GitHub',noDevice:'Вы вошли, но DaneDesk еще не связан.',link:'Лицензия принадлежит устройству. Выполните `foundstore-agent license-link <ЛИЦЕНЗИЯ>` на DaneDesk и подтвердите связь на открытой странице.',select:'Выберите DaneDesk',request:'Запросить установку',sent:'Запрос отправлен. Подтвердите установку на DaneDesk.',choose:'Сначала выберите DaneDesk.',failed:'Не удалось создать запрос.',category:'Fluthin'}};
      let locale=localStorage.getItem('foundstore-language')||((country==='RU')?'ru':(country==='BR'||country==='PT')?'pt':(navigator.language||'es').slice(0,2));if(!copy[locale])locale='es';let devices=[];language.value=locale;const t=k=>copy[locale][k]||copy.es[k],esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
      function translate(){document.documentElement.lang=locale;document.querySelectorAll('[data-i18n]').forEach(node=>node.textContent=t(node.dataset.i18n));document.getElementById('category').textContent=pkg.category||t('category');document.getElementById('name').textContent=pkg.name;const fallback=(pkg.name||'F').slice(0,1).toUpperCase(),visuals=pkg.visuals||{},mark=document.getElementById('mark'),portrait=document.getElementById('portrait');mark.innerHTML=`<img src="${esc(visuals.icon||'')}" alt="" onerror="this.remove()">`;if(!visuals.icon)mark.textContent=fallback;portrait.src=visuals.portrait||'';portrait.onerror=()=>{portrait.remove();mark.textContent=fallback};document.getElementById('description').textContent=pkg.description||t('category');document.getElementById('author').textContent=pkg.publisher||pkg.author;document.getElementById('platformTargets').innerHTML=(pkg.platformTargets||[]).map(platform=>`<span class="target">${esc(platform)}</span>`).join('')||'<span>—</span>';document.getElementById('readme').textContent=pkg.readme||'';document.getElementById('readmeSection').style.display=pkg.readme?'block':'none'}
      function showControls(signed){if(!signed){text.textContent=t('signin');controls.innerHTML=`<a class="signin" href="/auth/github/login">${t('sign')}</a>`;help.textContent='';return}if(!devices.length){text.textContent=t('noDevice');controls.innerHTML='';help.innerHTML=`<strong>${t('link')}</strong>`;return}text.textContent=t('signed');controls.innerHTML=`<select id="device"><option value="">${t('select')}</option>${devices.map(d=>`<option value="${esc(d.id)}">${esc(d.displayName)} · ${esc(d.status)}</option>`).join('')}</select><button id="request">${t('request')}</button>`;document.getElementById('request').onclick=requestInstall;help.textContent=''}
      async function requestInstall(){const id=document.getElementById('device').value;if(!id){result.textContent=t('choose');result.className='result error';return}result.textContent='…';result.className='result';const response=await fetch(`/api/v1/me/devices/${encodeURIComponent(id)}/installations`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:pkg.slug})});const data=await response.json();if(!response.ok){result.textContent=data.error||t('failed');result.className='result error';return}result.textContent=t('sent')}
      async function start(){translate();const response=await fetch('/api/v1/me/devices');const signed=response.ok;devices=signed?(await response.json()).devices||[]:[];showControls(signed)}language.onchange=()=>{locale=language.value;localStorage.setItem('foundstore-language',locale);translate();showControls(true)};start();
    </script>
  </body>
</html>
