services:
  - type: web
    runtime: python
    name: foundstore-fluthin
    branch: render
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 45 app:app
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 45
    disk:
      name: foundstore-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: MONGO_DATABASE
        value: foundstore
      - key: MONGODB_URI
        sync: false
      - key: OWNER_API_TOKEN
        generateValue: true
      - key: COMMAND_SIGNING_KEY
        generateValue: true
  - type: cron
    runtime: python
    name: foundstore-maintenance
    branch: render
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python maintenance.py
    envVars:
      - key: MONGO_DATABASE
        value: foundstore
      - key: MONGODB_URI
        sync: false
