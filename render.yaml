services:
  - type: web
    runtime: python
    name: foundstore-fluthin
    branch: render
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 45
    envVars:
      - key: PUBLIC_ORIGIN
        value: https://myfoundstore.onrender.com
      - key: GITHUB_OAUTH_REDIRECT_URI
        value: https://myfoundstore.onrender.com/auth/github/callback
      - key: MONGO_DATABASE
        value: foundstore
      - key: MONGO_URI
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: NULL_HV
        sync: false
  - type: cron
    runtime: python
    name: foundstore-maintenance
    branch: render
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python maintenance.py
    envVars:
      - key: MONGO_DATABASE
        value: foundstore
      - key: MONGO_URI
        sync: false
