<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acceso — foundstore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
    /* ============================================================
       VARIABLES
    ============================================================ */
    :root {
        --accent:       #b9a7ff;
        --accent-btn:   #7c3aed;
        --accent-btn2:  #9f5cff;
        --glass:        rgba(18, 22, 28, 0.62);
        --glass-border: rgba(255,255,255,.18);
        --field-bg:     rgba(255,255,255,.08);
        --field-border: rgba(255,255,255,.2);
        --text:         #ffffff;
        --text-dim:     rgba(255,255,255,.55);
        --font:         'Inter', -apple-system, system-ui, sans-serif;
        /* background filter — same hint as shown in image */
        --grades:       hue-rotate(104deg) saturate(.95) brightness(.9);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: var(--font);
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b2e0e;
        color: var(--text);
    }

    /* ============================================================
       FOREST BACKGROUND
    ============================================================ */
    .scene {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        filter: var(--grades);
    }

    .scene-sky {
        position: absolute;
        inset: 0;
        background:
            radial-gradient(ellipse 90% 70% at 65% 35%, #4dc65a 0%, transparent 55%),
            radial-gradient(ellipse 60% 50% at 20% 50%, #1d6b24 0%, transparent 60%),
            radial-gradient(ellipse 80% 60% at 80% 80%, #124a17 0%, transparent 55%),
            linear-gradient(175deg, #2a8f35 0%, #1a6622 30%, #0f4015 60%, #07200a 100%);
    }

    /* Central glow (light source) */
    .scene-glow {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(160,230,100,.45) 0%, transparent 70%);
        top: 25%; left: 55%;
        transform: translate(-50%,-50%);
        filter: blur(50px);
    }

    /* SVG trees / foliage */
    .scene-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }

    /* Floating leaves (JS-spawned) */
    .leaf {
        position: absolute;
        top: -40px;
        border-radius: 50% 5% 50% 5%;
        animation: leaf-fall linear forwards;
        pointer-events: none;
    }

    @keyframes leaf-fall {
        0%   { transform: translateY(0)      rotate(0deg)   translateX(0);    opacity: 0; }
        5%   { opacity: .85; }
        50%  { transform: translateY(45vh)   rotate(200deg) translateX(30px); }
        95%  { opacity: .6; }
        100% { transform: translateY(105vh)  rotate(420deg) translateX(-20px); opacity: 0; }
    }

    /* ============================================================
       CARD WRAPPER
    ============================================================ */
    .viewport {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 420px;
        padding: 20px;
    }

    .card {
        background: var(--glass);
        backdrop-filter: blur(24px) saturate(1.35);
        -webkit-backdrop-filter: blur(24px) saturate(1.35);
        border: 1px solid var(--glass-border);
        border-radius: 26px;
        padding: 40px 34px 34px;
        box-shadow:
            0 32px 80px rgba(0,0,0,.55),
            inset 0 1px 0 rgba(255,255,255,.1);
        animation: card-in .7s cubic-bezier(.16,1,.3,1) both;
        will-change: transform;
    }

    @keyframes card-in {
        from { opacity: 0; transform: translateY(28px) scale(.96); }
        to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    /* ============================================================
       HEADER
    ============================================================ */
    .header {
        margin-bottom: 30px;
    }

    .header h1 {
        font-size: 2.1rem;
        font-weight: 800;
        letter-spacing: -.035em;
        line-height: 1.1;
        margin-bottom: 7px;
    }

    .header p {
        font-size: .875rem;
        color: var(--text-dim);
        font-weight: 400;
    }

    /* ============================================================
       PANELS (login / register)
    ============================================================ */
    .panel { display: none; }
    .panel.active {
        display: block;
        animation: fade-up .32s cubic-bezier(.2,0,0,1) both;
    }

    @keyframes fade-up {
        from { opacity: 0; transform: translateY(9px); }
        to   { opacity: 1; transform: translateY(0);   }
    }

    /* ============================================================
       FLOATING-LABEL FIELDS
    ============================================================ */
    .field {
        position: relative;
        margin-bottom: 14px;
    }

    .field label {
        position: absolute;
        top: 9px;
        left: 16px;
        font-size: .7rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: .04em;
        pointer-events: none;
        user-select: none;
        text-transform: capitalize;
    }

    .field input {
        width: 100%;
        background: var(--field-bg);
        border: 1px solid var(--field-border);
        border-radius: 14px;
        padding: 26px 44px 10px 16px;
        color: var(--text);
        font-size: 1rem;
        font-family: var(--font);
        outline: none;
        transition: border-color .22s, box-shadow .22s;
        appearance: none;
        -webkit-appearance: none;
    }

    .field input::placeholder { color: transparent; }

    .field input:focus {
        border-color: rgba(185,167,255,.6);
        box-shadow: 0 0 0 3px rgba(185,167,255,.18);
    }

    /* Eye button */
    .eye-btn {
        position: absolute;
        right: 13px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        padding: 4px;
        transition: color .2s;
        line-height: 0;
    }
    .eye-btn:hover { color: var(--text); }
    .eye-btn svg { display: block; }

    /* ============================================================
       REMEMBER ROW
    ============================================================ */
    .remember-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px;
        margin: 18px 0 22px;
    }
    @media (max-width: 380px) {
        .remember-row {
            flex-direction: column;
            align-items: flex-start;
        }
    }

    .remember-row .check-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: .875rem;
        color: var(--text-dim);
        cursor: pointer;
    }

    .remember-row input[type=checkbox] {
        width: 16px;
        height: 16px;
        border-radius: 5px;
        accent-color: var(--accent-btn);
        cursor: pointer;
        flex-shrink: 0;
    }

    .forgot-link {
        font-size: .875rem;
        color: var(--text-dim);
        text-decoration: none;
        transition: color .2s;
    }
    .forgot-link:hover { color: var(--text); }

    /* ============================================================
       PRIMARY BUTTON
    ============================================================ */
    .btn-main {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(110deg, var(--accent-btn) 0%, var(--accent-btn2) 55%, #c084fc 100%);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        font-family: var(--font);
        cursor: pointer;
        box-shadow: 0 8px 28px rgba(124,58,237,.5);
        transition: opacity .2s, transform .18s, box-shadow .2s;
        letter-spacing: .01em;
        position: relative;
        overflow: hidden;
    }

    .btn-main::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(rgba(255,255,255,.12), transparent);
        border-radius: inherit;
        pointer-events: none;
    }

    .btn-main:hover  { opacity: .93; transform: translateY(-1px); box-shadow: 0 12px 36px rgba(124,58,237,.6); }
    .btn-main:active { transform: translateY(0); }
    .btn-main.is-loading { opacity: .55; pointer-events: none; }

    /* ============================================================
       DIVIDER
    ============================================================ */
    .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 22px 0;
        color: var(--text-dim);
        font-size: .78rem;
        white-space: nowrap;
    }
    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(255,255,255,.12);
    }

    /* ============================================================
       SOCIAL / OAUTH BUTTONS
    ============================================================ */
    .social-row {
        display: flex;
        gap: 10px;
    }

    .btn-social {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.15);
        border-radius: 14px;
        color: var(--text);
        font-size: .9rem;
        font-weight: 600;
        font-family: var(--font);
        text-decoration: none;
        cursor: pointer;
        transition: background .2s, transform .18s;
        line-height: 1;
    }
    .btn-social:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
    .btn-social svg   { flex-shrink: 0; display: block; }

    /* ============================================================
       FOOTER NOTE
    ============================================================ */
    .card-foot {
        text-align: center;
        margin-top: 22px;
        font-size: .875rem;
        color: var(--text-dim);
    }

    .card-foot a,
    .card-foot button.link-btn {
        color: var(--text-dim);
        text-decoration: none;
        font-weight: 600;
        background: none;
        border: none;
        cursor: pointer;
        font-family: var(--font);
        font-size: inherit;
        padding: 0;
        transition: color .2s;
    }
    .card-foot a:hover,
    .card-foot button.link-btn:hover { color: var(--text); }

    /* ============================================================
       REGISTER-PANEL HEADER
    ============================================================ */
    .reg-header {
        margin-bottom: 22px;
    }
    .reg-header h2 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -.025em;
        margin-bottom: 5px;
    }
    .reg-header p {
        font-size: .875rem;
        color: var(--text-dim);
    }

    /* ============================================================
       TOAST
    ============================================================ */
    #toast {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        padding: 11px 22px;
        border-radius: 12px;
        background: rgba(15,18,24,.96);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255,255,255,.1);
        color: #fff;
        font-weight: 600;
        font-size: .875rem;
        font-family: var(--font);
        box-shadow: 0 8px 28px rgba(0,0,0,.45);
        z-index: 999;
        display: none;
        white-space: nowrap;
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 460px) {
        .card { padding: 32px 22px 28px; }
        .header h1 { font-size: 1.75rem; }
    }
    </style>
</head>
<body>

<!-- ══════════════════════════════════════

<!-- ══════════════════════════════════════
     AUTH CARD
══════════════════════════════════════ -->
<div class="viewport">
    <div class="card" id="card">

        <!-- ── LOGIN PANEL ── -->
        <div id="panel-login" class="panel active">

            <div class="header">
                <h1>Bienvenido de nuevo</h1>
                <p>Inicia sesión para continuar en foundstore</p>
            </div>

            <!-- Telegram ID + password fields -->
            <div class="field">
                <label for="li-id">Telegram ID</label>
                <input type="text" id="li-id" placeholder="ID numérico" required
                       inputmode="numeric" autocomplete="username">
            </div>

            <div class="field">
                <label for="li-pass">Contraseña</label>
                <input type="password" id="li-pass" placeholder="••••••••" required
                       autocomplete="current-password">
                <button type="button" class="eye-btn" id="eye-li" aria-label="Mostrar contraseña"
                        onclick="toggleVis('li-pass','eye-li')">
                    <!-- eye open -->
                    <svg id="eye-li-icon" width="19" height="19" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <div class="remember-row">
                <label class="check-label">
                    <input type="checkbox" id="remember-me"> Recuérdame
                </label>
                <a href="/help" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="button" class="btn-main" id="btn-login">Entrar</button>

            <div class="divider">o continúa con</div>

            <div class="social-row">
                <!-- GitHub OAuth -->
                <a href="/login/github" class="btn-social">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58
                                 0-.29-.01-1.04-.02-2.05-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76
                                 -1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.84 2.81 1.3 3.5 1
                                 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22
                                 -.13-.3-.54-1.52.11-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0
                                 c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22
                                 0 4.61-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6-.01 2.89-.01 3.29
                                 0 .32.22.69.83.58A12 12 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    GitHub
                </a>

                <!-- Telegram (link to onboarding) -->
                <a href="/onboarding/step2" class="btn-social">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562
                                 8.248-1.97 9.269c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053
                                 5.56-5.023c.242-.213-.054-.333-.373-.12l-6.871 4.326-2.962-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.833.952z"/>
                    </svg>
                    Telegram
                </a>
            </div>

            <div class="card-foot">
                ¿Nuevo en foundstore?
                <button class="link-btn" onclick="switchPanel('register')">Crear cuenta</button>
            </div>
        </div><!-- /panel-login -->


        <!-- ── REGISTER PANEL ── -->
        <div id="panel-register" class="panel">

            <div class="reg-header">
                <h2>Crear cuenta</h2>
                <p>Únete a la comunidad de desarrolladores</p>
            </div>

            <div class="field">
                <label for="rg-id">ID de Telegram</label>
                <input type="text" id="rg-id" placeholder="Ej: 12345678" required
                       inputmode="numeric" autocomplete="username">
            </div>

            <div class="field">
                <label for="rg-pass">Contraseña</label>
                <input type="password" id="rg-pass" placeholder="Mínimo 8 caracteres" required
                       autocomplete="new-password">
                <button type="button" class="eye-btn" id="eye-rg" aria-label="Mostrar contraseña"
                        onclick="toggleVis('rg-pass','eye-rg')">
                    <svg id="eye-rg-icon" width="19" height="19" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <div class="field" style="margin-bottom:22px;">
                <label for="rg-conf">Confirmar Contraseña</label>
                <input type="password" id="rg-conf" placeholder="Repite tu contraseña" required
                       autocomplete="new-password">
            </div>

            <button type="button" class="btn-main" id="btn-register">Crear Cuenta</button>

            <div class="card-foot">
                ¿Ya tienes cuenta?
                <button class="link-btn" onclick="switchPanel('login')">Iniciar sesión</button>
            </div>
        </div><!-- /panel-register -->

    </div><!-- /card -->
</div><!-- /viewport -->

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ──────────────────────────────────────
   PANEL SWITCH
────────────────────────────────────── */
function switchPanel(id) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
}

/* ──────────────────────────────────────
   EYE / PASSWORD TOGGLE
────────────────────────────────────── */
function toggleVis(inputId, btnId) {
    const input = document.getElementById(inputId);
    const icon  = document.getElementById(btnId + '-icon');
    const show  = input.type === 'password';
    input.type  = show ? 'text' : 'password';
    /* swap icon: open eye ↔ closed eye */
    icon.innerHTML = show
        ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
           <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
           <line x1="1" y1="1" x2="23" y2="23"/>`
        : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
           <circle cx="12" cy="12" r="3"/>`;
}

/* ──────────────────────────────────────
   TOAST
────────────────────────────────────── */
let _toastTimer;
function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    t.style.borderColor = type === 'error'
        ? 'rgba(239,68,68,.4)' : 'rgba(255,255,255,.1)';
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
}

/* ──────────────────────────────────────
   LOGIN
────────────────────────────────────── */
document.getElementById('btn-login').addEventListener('click', async () => {
    const btn  = document.getElementById('btn-login');
    const id   = document.getElementById('li-id').value.trim();
    const pass = document.getElementById('li-pass').value;
    if (!id || !pass) return showToast('Completa todos los campos', 'error');

    btn.classList.add('is-loading');
    btn.textContent = 'Entrando…';
    try {
        const res  = await fetch('/api/auth/login_telegram', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ telegram_id: id, password: pass })
        });
        const data = await res.json();
        if (res.ok) {
            showToast('¡Bienvenido!');
            window.location.href = '/';
        } else {
            showToast(data.message || 'ID o contraseña incorrectos', 'error');
        }
    } catch {
        showToast('Error de red. Intenta de nuevo.', 'error');
    } finally {
        btn.classList.remove('is-loading');
        btn.textContent = 'Entrar';
    }
});

/* ──────────────────────────────────────
   REGISTER
────────────────────────────────────── */
document.getElementById('btn-register').addEventListener('click', async () => {
    const btn  = document.getElementById('btn-register');
    const id   = document.getElementById('rg-id').value.trim();
    const pass = document.getElementById('rg-pass').value;
    const conf = document.getElementById('rg-conf').value;

    if (!id || !pass || !conf) return showToast('Completa todos los campos', 'error');
    if (pass !== conf)         return showToast('Las contraseñas no coinciden', 'error');
    if (pass.length < 8)       return showToast('La contraseña debe tener al menos 8 caracteres', 'error');

    btn.classList.add('is-loading');
    btn.textContent = 'Creando cuenta…';
    try {
        const res  = await fetch('/api/auth/register_telegram', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ telegram_id: id, password: pass })
        });
        const data = await res.json();
        if (res.ok) {
            showToast('Cuenta creada. ¡Bienvenido!');
            window.location.href = '/';
        } else {
            showToast(data.message || 'No se pudo crear la cuenta', 'error');
        }
    } catch {
        showToast('Error de red. Intenta de nuevo.', 'error');
    } finally {
        btn.classList.remove('is-loading');
        btn.textContent = 'Crear Cuenta';
    }
});

/* ──────────────────────────────────────
   3-D CARD TILT  (matches image JS hint)
────────────────────────────────────── */
const card = document.getElementById('card');
addEventListener('pointermove', e => {
    const nx = e.clientX / innerWidth  - .5;
    const ny = e.clientY / innerHeight - .5;
    card.style.setProperty('--ry',  nx * 9 + 'deg');
    card.style.setProperty('--rx', -ny * 9 + 'deg');
    card.style.transform =
        'perspective(900px) rotateX(var(--rx,0)) rotateY(var(--ry,0))';
});
addEventListener('pointerleave', () => {
    card.style.transform = 'perspective(900px) rotateX(0) rotateY(0)';
});

/* ──────────────────────────────────────
   FLOATING LEAF SPAWNER
────────────────────────────────────── */
(function spawnLeaves() {
    const scene  = document.querySelector('.scene');
    const colors = ['#2d9e38','#38c045','#4dcc5a','#1f8030','#29a83a','#55d465','#1a6b22'];

    function makeLeaf() {
        const el   = document.createElement('div');
        el.className = 'leaf';
        const w    = 14 + Math.random() * 20;
        const h    = w * (.45 + Math.random() * .35);
        const dur  = 9  + Math.random() * 11;
        const del  = Math.random() * 5;
        const col  = colors[Math.floor(Math.random() * colors.length)];
        el.style.cssText = `
            left:${Math.random() * 100}%;
            width:${w}px;
            height:${h}px;
            background:${col};
            border-radius: ${40 + Math.random() * 20}% ${10 + Math.random() * 10}% ${40 + Math.random() * 20}% ${10 + Math.random() * 10}%;
            animation-duration:${dur}s;
            animation-delay:${del}s;
            transform:rotate(${Math.random() * 360}deg);
            opacity:${.55 + Math.random() * .4};
        `;
        scene.appendChild(el);
        el.addEventListener('animationend', () => el.remove(), { once: true });
    }

    for (let i = 0; i < 10; i++) makeLeaf();        // initial batch
    setInterval(makeLeaf, 1100);                    // continuous spawn
})();
</script>
